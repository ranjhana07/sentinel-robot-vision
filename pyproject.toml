[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-robot-vision"
version = "0.2.0"
description = "Face detection and spoken responses for surveillance robots, with LLM summaries of robot logs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "onnxruntime>=1.17",
    "pyyaml>=6.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "typer>=0.12",
]

[project.optional-dependencies]
tts = ["pyttsx3>=2.90"]
pi = ["picamera2"]
train = ["ultralytics>=8.1"]
rag = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langsmith>=0.2",
]
dev = ["pytest>=8.0"]

[project.scripts]
sentinel = "sentinel.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
