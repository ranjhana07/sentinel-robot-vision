detector:
  model_path: models/face-yolov8n-int8.onnx
  input_size: 416
  conf_threshold: 0.35
  iou_threshold: 0.45
  intra_op_threads: 4

source:
  kind: camera
  target: 0
  width: 640
  height: 480
  queue_size: 2

logging:
  directory: logs
  filename: robot.jsonl
  max_bytes: 5000000
  backup_count: 5
  robot_id: sentinel-01

tracker:
  iou_threshold: 0.3
  max_age: 15
  min_hits: 2
  use_motion: true
  velocity_smoothing: 0.6

speech:
  backend: pyttsx3
  rate: 170
  cooldown_seconds: 20
  unknown_cooldown_seconds: 45
  greeting: "Hello {name}"
  unknown_phrase: "Unknown person detected"
  group_phrase: "{count} unknown people detected"
  zones:
    - name: restricted
      area: [0.55, 0.0, 1.0, 1.0]
      phrase: "This area is restricted. Please step back."
      applies_to: unknown
      cooldown_seconds: 30

rag:
  persist_dir: data/chroma
  collection: robot_logs
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  window_minutes: 10
  max_chunk_chars: 3000
  top_k: 6
